# Configuración para Render.com (Blueprint).
# En Render: New > Blueprint > elige el repositorio. Render lee este archivo solo.
services:
  - type: web
    name: 185changarroweb
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /salud
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Panel de administración y buzón de solicitudes. Los valores se ponen en Render > Environment (ver integraciones/README.md).
      - key: ADMIN_CLAVE_HASH
        sync: false
      - key: APPS_SCRIPT_URL
        sync: false
      - key: APPS_SCRIPT_SECRETO
        sync: false
